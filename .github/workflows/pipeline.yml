name: Primer Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  hello-ci:
    name: Hello CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mostrar información del entorno
        run: |
          echo "================================"
          echo "      PRIMER PIPELINE CI"
          echo "================================"
          echo "Repositorio: ${{ github.repository }}"
          echo "Rama: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "================================"

      - name: Mostrar fecha y hora
        run: date

      - name: Mostrar versión de Git
        run: git --version

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Ejecutar pruebas unitarias
        run: npm test

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

      - name: Finalizar pipeline
        run: echo "Pipeline ejecutado correctamente."